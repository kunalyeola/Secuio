<style>
:root{--blue:#007BFF;--ink:#0b2a52;--soft:#f2f8ff;--line:#cfe3ff;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.bar{height:8px;background:var(--blue)}

.soon{margin-top:32px;padding:16px 36px;border-radius:16px;border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--blue);font-weight:800;font-size:.95rem;letter-spacing:.14em;line-height:1.5;text-transform:uppercase}
.contact{margin-top:44px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 40px;font-size:1.1rem}
.contact a{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;text-decoration:none}
.contact a:hover{color:var(--blue)}
.contact svg{width:22px;height:22px;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
footer{background:var(--blue);color:#fff;text-align:center;padding:16px 20px;font-size:.85rem}
